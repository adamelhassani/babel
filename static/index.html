<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Babel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.panel{border:1px solid #333;border-radius:8px;padding:8px;min-height:220px}
#controls label{display:block;margin:4px 0}
button,select,input{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px 8px}
h3{margin:4px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin:2px;background:#888}
table{border-collapse:collapse}td{padding:1px 6px}
</style>
</head>
<body>
<div class="panels">
  <div class="panel"><h3>Map</h3><select id="objsel"></select><div id="map"></div></div>
  <div class="panel"><h3>Oversight gap</h3><canvas id="chart"></canvas></div>
  <div class="panel"><h3>Live dictionary</h3><div id="dict"></div></div>
  <div class="panel" id="controls"><h3>Controls</h3>
    <div id="status" style="color:#888;font-size:12px"></div>
    <label>preset <select id="preset"><option>low</option><option>high</option></select></label>
    <label>MAX_LEN <input id="maxlen" type="number" value="3" style="width:60px"></label>
    <label>NOISE <input id="noise" type="number" step="0.1" value="0" style="width:60px"></label>
    <label>DISTRACTORS <input id="ndist" type="number" value="3" style="width:60px"></label>
    <button id="start">start run</button>
    <button id="opentrade">open trade route</button>
    <button id="setdials">set dials</button>
    <hr>
    <label>village <select id="village"></select></label>
    <button id="offer">get objects (human speaks)</button>
    <div id="offerbox"></div>
    <label>message <input id="msg" placeholder="ka mo"></label>
    <label>choice <select id="choice"></select></label>
    <button id="commit">trade</button>
    <button id="speak">speak message aloud</button>
    <div id="traderesult"></div>
    <hr>
    <label>replay run <select id="replay"></select></label>
    <input id="scrub" type="range" min="0" max="0" value="0" style="width:100%">
  </div>
</div>
<script>
let runId = null, chart = null, pollTimer = null, offerId = null;
const $ = id => document.getElementById(id);
const VILLAGE_COLORS = {village0: "#e74c3c", village1: "#2ecc71", village2: "#3498db"};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function drawChart(records) {
  const labels = records.map(r => `${r.phase[0]}${r.round}`);
  const datasets = [];
  for (const v of Object.keys(VILLAGE_COLORS)) {
    datasets.push({label: v + " insider", data: records.map(r => (r.villages[v] || {}).insider_success ?? null),
                   borderColor: VILLAGE_COLORS[v], tension: 0.2});
    datasets.push({label: v + " decoder", data: records.map(r => (r.villages[v] || {}).decoder_accuracy ?? null),
                   borderColor: VILLAGE_COLORS[v], borderDash: [4, 4], tension: 0.2});
  }
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {type: "line", data: {labels, datasets},
                                 options: {scales: {y: {min: 0, max: 1}}}});
}

function renderMap(records, games) {
  const sel = $("objsel");
  if (!sel.options.length) {
    for (const t of [...new Set(games.map(g => g.target))]) sel.add(new Option(t, t));
  }
  const obj = sel.value || (games[0] && games[0].target);
  const latest = records[records.length - 1];
  const map = $("map");
  map.innerHTML = "";
  if (!latest) {
    if (!games.length) return;
    const wait = document.createElement("div");
    wait.textContent = `waiting for first checkpoint (round 10) — ${games.length} games logged`;
    map.appendChild(wait);
    for (const g of games.slice(-5)) {
      const div = document.createElement("div");
      div.textContent = `${g.speaker}: "${g.message}" -> ${g.target} ${g.success ? "OK" : "miss"}`;
      map.appendChild(div);
    }
    return;
  }
  if (!obj) return;
  for (const [v, entry] of Object.entries(latest.villages)) {
    const div = document.createElement("div");
    div.innerHTML = `<b>${v}</b> `;
    const word = (entry.dictionary || {})[obj] || "?";
    for (let i = 0; i < 4; i++) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = VILLAGE_COLORS[v] || "#888";
      dot.title = `${v}-${i}: ${word}`;
      div.appendChild(dot);
    }
    map.appendChild(div);
  }
}

function renderDict(records) {
  const latest = records[records.length - 1];
  const el = $("dict");
  el.innerHTML = "";
  if (!latest) return;
  for (const [v, entry] of Object.entries(latest.villages)) {
    const h = document.createElement("h4");
    h.textContent = v;
    el.appendChild(h);
    const tbl = document.createElement("table");
    for (const [obj, word] of Object.entries(entry.dictionary || {})) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${obj}</td><td><b>${word}</b></td>`;
      tbl.appendChild(tr);
    }
    el.appendChild(tbl);
  }
}

async function refresh() {
  if (!runId) return;
  const data = await api(`/api/run/${runId}`);
  $("status").textContent = `run ${runId}: ${data.games.length} games, ${data.records.length} checkpoints` +
    (data.records.length ? "" : " (chart starts at round 10)");
  drawChart(data.records);
  renderMap(data.records, data.games);
  renderDict(data.records);
}

async function refreshReplay() {
  const id = $("replay").value;
  if (!id) return;
  const data = await api(`/api/run/${id}`);
  $("scrub").max = data.games.length;
  drawChart(data.records);
  renderMap(data.records, data.games.slice(0, Number($("scrub").value)));
  renderDict(data.records);
}

$("start").onclick = async () => {
  const body = {preset: $("preset").value, backend: "B", auto_open: false};
  const res = await api("/api/run/start", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  runId = res.run_id;
  clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 2000);
  await refresh();
};
$("opentrade").onclick = () => api(`/api/run/${runId}/control`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action: "open_trade"})});
$("setdials").onclick = () => api(`/api/run/${runId}/control`, {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({action: "set_dials", params: {MAX_LEN: Number($("maxlen").value), NOISE: Number($("noise").value), N_DISTRACTORS: Number($("ndist").value)}})});
$("offer").onclick = async () => {
  const res = await api("/api/trade/offer", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({run_id: runId, village: $("village").value})});
  offerId = res.offer_id;
  $("offerbox").textContent = "options: " + res.options.join(" | ");
  const sel = $("choice");
  sel.innerHTML = "";
  res.options.forEach((o, i) => sel.add(new Option(i + ": " + o, i)));
};
$("commit").onclick = async () => {
  const res = await api("/api/trade/commit", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({run_id: runId, offer_id: offerId, message: $("msg").value, choice: Number($("choice").value)})});
  $("traderesult").textContent = `valid=${res.valid} heard=${res.heard} choice=${res.choice} success=${res.success} target=${res.target}`;
  await refresh();
};
$("speak").onclick = () => { new Audio("/api/audio?text=" + encodeURIComponent($("msg").value)).play(); };
$("replay").onchange = refreshReplay;
$("scrub").oninput = refreshReplay;
$("objsel").onchange = refresh;

(async () => {
  const runs = await api("/api/runs");
  runs.runs.forEach(r => $("replay").add(new Option(r, r)));
  for (const v of Object.keys(VILLAGE_COLORS)) $("village").add(new Option(v, v));
})();
</script>
</body>
</html>
