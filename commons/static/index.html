<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commons</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
#topbar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #333;flex-wrap:wrap}
button,select,input{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px 8px}
.panels{display:grid;grid-template-columns:400px 1fr 1fr;gap:8px;padding:8px}
.panel{border:1px solid #333;border-radius:8px;padding:8px;min-height:300px}
.panel.lake{grid-row:span 2}
@media (max-width:1250px){.panels{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.panels{grid-template-columns:1fr}.panel.lake{grid-row:auto}}
h3{margin:4px 0}
#lakebox{position:relative;width:340px;height:340px;margin:0 auto}
#lake{position:absolute;left:40px;top:40px}
.boat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:96px}
.boat .bubble{background:#fff;color:#111;border-radius:8px;padding:2px 6px;font-size:11px;min-height:30px;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.boat .hull{font-size:18px;line-height:1;border-radius:50%}
.boat .name{font-size:10px;color:#ccc}
#roundlabel,#status{font-size:12px;color:#aaa;white-space:nowrap}
.rulebox{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 10px;font-size:12px;color:#f1c40f;border-bottom:1px solid #333}
.rulebox b{color:#eee;font-weight:600}
#currule{padding:2px 10px;font-size:12px;color:#7fd4ff;border-bottom:1px solid #333}
.boat .fstat{font-size:9px;color:#e74c3c;min-height:11px}
.boat.banned{opacity:.45}
.boat .play{font-size:10px;padding:0 5px;margin-top:1px}
button:disabled{opacity:.3}
#mic.recording{background:#7a1f1f;border-color:#e74c3c}
.panel table{border-collapse:collapse;font-size:11px}
.panel td,.panel th{padding:1px 6px;border-bottom:1px solid #222;text-align:right}
.panel th{color:#aaa}
.panel td:first-child,.panel th:first-child{text-align:left}
.hit{color:#2ecc71;font-weight:600}
#micstatus{font-size:12px;color:#888}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #444;border-radius:16px;padding:6px 14px;font-size:12px;color:#ccc;z-index:10;transition:opacity .4s;opacity:0}
#toast{display:none;position:fixed;top:10px;right:10px;background:#7a1f1f;border:1px solid #e74c3c;color:#fff;border-radius:6px;padding:8px 12px;font-size:12px;z-index:20;max-width:380px}
canvas{max-height:340px}
</style>
</head>
<body>
<div id="topbar">
  <h3 style="margin:0">Commons</h3>
  <label>run <select id="runpicker" title="pick a saved or live run"></select></label>
  <label>seed <input id="seed" type="number" value="0" style="width:60px" title="seed for a new run"></label>
  <button id="startrun" title="start a live run with this seed">start run</button>
  <button id="play" title="play the replay (space)">play</button>
  <button id="pause" title="pause replay / stop following a live run">pause</button>
  <input id="round" type="range" min="1" max="1" value="1" style="flex:1" title="round slider (left/right arrows)">
  <span id="roundlabel"></span>
  <span id="status"></span>
  <input id="ruletext" type="text" placeholder="type a rule: nobody may take more than 6 fish..." style="flex:1" title="rule text — parse to preview, then apply">
  <button id="parsebtn" title="parse the rule text (preview only, no effect yet)">parse</button>
  <button id="applyrule" title="apply the parsed rule to the selected live run" disabled>apply</button>
  <button id="mic" title="record a rule aloud; the transcript fills the rule box">● rec</button>
  <span id="micstatus"></span>
</div>
<div class="rulebox" id="rulebox"></div>
<div id="currule"></div>
<div class="panels">
  <div class="panel lake"><h3>Lake</h3>
    <div id="lakebox">
      <svg id="lake" width="260" height="260">
        <circle id="lakecircle" cx="130" cy="130" r="100" fill="#3498db"/>
        <text id="laketext" x="130" y="127" text-anchor="middle" font-size="20" fill="#fff">600</text>
        <text id="lakedead" x="130" y="150" text-anchor="middle" font-size="12" fill="#ff6b6b" style="display:none">LAKE DEAD</text>
      </svg>
      <div id="boats"></div>
    </div>
  </div>
  <div class="panel"><h3>Stock over rounds</h3><canvas id="stockchart"></canvas></div>
  <div class="panel"><h3>Catch vs report</h3><canvas id="catchchart"></canvas></div>
  <div class="panel"><h3>Results (avg by rule, sorted by rounds survived)</h3><div id="resultstable"></div></div>
  <div class="panel"><h3>Inspector</h3><div id="inspectorbox"></div></div>
</div>
<div id="hint">▶ play or scrub the round slider · pick a run top-left · parse + apply a rule</div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let C = null, rounds = [], cur = 1, timer = null, stockChart = null, catchChart = null;
let liveRunId = null, followLive = true, runActive = {}, pendingRule = null;
let mediaRecorder = null, micChunks = [], pollCount = 0;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 5000);
}

function showHint() {
  const h = $("hint");
  h.style.opacity = "1";
  clearTimeout(h._h);
  h._h = setTimeout(hideHint, 8000);
}

function hideHint() {
  const h = $("hint");
  h.style.opacity = "0";
  setTimeout(() => { h.style.display = "none"; }, 400);
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function init() {
  C = await api("/api/constants");
  const data = await api("/api/runs");
  const picker = $("runpicker");
  const names = [];
  for (const r of data.runs) {
    const id = typeof r === "string" ? r : r && r.name;
    if (!id) continue;
    names.push(id);
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = id;
    picker.appendChild(opt);
  }
  if (names.includes("batch-D-emergency-relax-s0")) picker.value = "batch-D-emergency-relax-s0";
  else if (names.length) picker.value = names[0];
  picker.onchange = () => { liveRunId = null; followLive = true; $("pause").textContent = "pause"; hideHint(); loadRun(picker.value); };
  $("startrun").onclick = startRun;
  $("parsebtn").onclick = parseRule;
  $("applyrule").onclick = applyRule;
  $("mic").onclick = toggleMic;
  $("play").onclick = () => { hideHint(); play(); };
  $("pause").onclick = onPauseClick;
  $("ruletext").oninput = () => { pendingRule = null; $("applyrule").disabled = true; };
  $("round").oninput = e => { cur = +e.target.value; pause(); hideHint(); render(); };
  await refreshPicker();
  if (picker.value) await loadRun(picker.value);
  await loadResults();
  showHint();
  setInterval(poll, 1000);
}

async function startRun() {
  const seed = +$("seed").value || 0;
  const r = await fetch("/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({seed})});
  if (!r.ok) { toast("start failed: " + await r.text()); return; }
  const data = await r.json();
  liveRunId = data.run_id;
  followLive = true;
  $("pause").textContent = "pause";
  hideHint();
  await refreshPicker();
  $("runpicker").value = liveRunId;
  try { await loadRun(liveRunId); } catch (e) { render(); }
}

async function parseRule() {
  const text = $("ruletext").value.trim();
  if (!text) return;
  const r = await fetch("/parse", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  if (!r.ok) { toast("parse failed: " + await r.text()); return; }
  pendingRule = (await r.json()).rule;
  showRule(pendingRule, true);
  $("applyrule").disabled = false;
  $("status").textContent = "rule parsed (preview)";
}

async function applyRule() {
  const runId = $("runpicker").value;
  const text = $("ruletext").value.trim();
  if (!runId || !text) return;
  const r = await fetch("/rule", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({run_id: runId, text})});
  if (!r.ok) { toast("rule failed: " + await r.text()); return; }
  const data = await r.json();
  pendingRule = null;
  showRule(data.rule, false);
  $("applyrule").disabled = true;
  $("status").textContent = "rule applied to " + runId;
  if (runId === liveRunId) poll();
}

function showRule(rule, pending) {
  const box = $("rulebox");
  box.innerHTML = "";
  const tag = document.createElement("span");
  tag.innerHTML = pending
    ? '<b style="color:#f1c40f">preview — not applied yet</b>'
    : '<b style="color:#2ecc71">applied ✓</b>';
  box.appendChild(tag);
  for (const [k, v] of Object.entries(rule)) {
    const s = document.createElement("span");
    const b = document.createElement("b");
    b.textContent = k + ": ";
    s.appendChild(b);
    s.appendChild(document.createTextNode(String(v)));
    box.appendChild(s);
  }
}

async function refreshPicker() {
  const data = await api("/api/runs");
  const picker = $("runpicker");
  runActive = {};
  for (const r of data.runs) {
    const id = typeof r === "string" ? r : r && r.name;
    if (!id) continue;
    runActive[id] = !!(r && r.active);
    if (![...picker.options].some(o => o.value === id)) {
      const opt = document.createElement("option");
      opt.value = id;
      picker.appendChild(opt);
    }
  }
  for (const opt of picker.options) {
    const live = !!runActive[opt.value];
    opt.textContent = opt.value + (live ? " ●LIVE" : "");
    opt.style.color = live ? "#2ecc71" : "";
  }
}

async function poll() {
  pollCount++;
  if (liveRunId) {
    let data;
    try {
      data = await api("/state/" + encodeURIComponent(liveRunId));
    } catch (e) {
      data = null;
    }
    if (data) {
      rounds = data.rounds;
      const slider = $("round");
      slider.max = Math.max(1, rounds.length);
      if (rounds.length && followLive) cur = rounds.length;
      render();
      await refreshPicker();
      if (!data.active) {
        liveRunId = null;
        followLive = true;
        $("pause").textContent = "pause";
      }
    }
  }
  await loadInspector();
  if (pollCount % 5 === 0) await loadResults();
}

async function loadRun(id) {
  const data = await api("/api/runs/" + encodeURIComponent(id) + "/rounds");
  rounds = data.rounds;
  const slider = $("round");
  slider.min = 1;
  slider.max = Math.max(1, rounds.length);
  cur = 1;
  slider.value = cur;
  buildBoats();
  render();
}

function buildBoats() {
  const box = $("boats");
  box.innerHTML = "";
  const n = rounds.length ? rounds[rounds.length - 1].fishers.length : C.N;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "boat";
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    d.style.left = (170 + 150 * Math.cos(ang)) + "px";
    d.style.top = (170 + 150 * Math.sin(ang)) + "px";
    d.innerHTML = '<div class="bubble"></div><div class="hull">🛶</div><div class="name"></div><div class="fstat"></div><button class="play" title="speak this line aloud">▶</button>';
    box.appendChild(d);
  }
}

function render() {
  if (!rounds.length) return;
  const rec = rounds[cur - 1];
  if ($("boats").children.length !== rec.fishers.length) buildBoats();
  $("round").value = cur;
  const dead = rec.stock_after < C.F_DEAD;
  $("roundlabel").textContent = "round " + rec.round + " / " + rounds.length;
  $("status").textContent = dead ? "lake dead" : "stock " + rec.stock_after;
  $("currule").textContent = rec.rule ? "in effect: " + rec.rule.plain_text : "no rule in effect";
  const circle = $("lakecircle");
  const frac = Math.max(0, Math.min(1, rec.stock_after / C.K));
  circle.setAttribute("r", (20 + 110 * Math.sqrt(frac)).toFixed(1));
  circle.setAttribute("fill", dead ? "#666" : "#3498db");
  $("laketext").textContent = Math.round(rec.stock_after);
  $("lakedead").style.display = dead ? "" : "none";
  const boats = $("boats").children;
  rec.fishers.forEach((f, i) => {
    if (!boats[i]) return;
    boats[i].querySelector(".bubble").textContent = f.say || "";
    boats[i].querySelector(".name").textContent = f.name;
    boats[i].querySelector(".fstat").textContent = f.banned ? "banned" : (f.fined > 0 ? "fined " + f.fined : "");
    boats[i].classList.toggle("banned", !!f.banned);
    const hull = boats[i].querySelector(".hull");
    hull.textContent = f.banned ? "🚫" : "🛶";
    hull.style.boxShadow = f.fined > 0 ? "0 0 0 2px #e74c3c" : "";
    const pb = boats[i].querySelector(".play");
    pb.disabled = !f.say;
    pb.onclick = () => speakLine(f.say);
  });
  updateStockChart();
  updateCatchChart(rec);
}

function ruleMarkerRounds() {
  const markers = new Set();
  for (let i = 0; i < rounds.length; i++) {
    const r = rounds[i].rule;
    const prev = i > 0 ? rounds[i - 1].rule : null;
    if (r && (!prev || JSON.stringify(prev) !== JSON.stringify(r))) markers.add(rounds[i].round);
  }
  return markers;
}

function updateStockChart() {
  const seen = rounds.slice(0, cur);
  const labels = seen.map(r => r.round);
  const stock = seen.map(r => r.stock_after);
  const halfK = labels.map(() => C.K / 2);
  const markers = ruleMarkerRounds();
  const marks = labels.map(l => markers.has(l) ? C.K * 0.97 : null);
  if (!stockChart) {
    stockChart = new Chart($("stockchart"), {
      type: "line",
      data: {labels, datasets: [
        {label: "stock", data: stock, borderColor: "#3498db", pointRadius: 2, tension: 0.2},
        {label: "K/2 = " + C.K / 2, data: halfK, borderColor: "#888", borderDash: [6, 6], pointRadius: 0, fill: false},
        {label: "rule applied", data: marks, showLine: false, pointRadius: 6, pointBackgroundColor: "#f1c40f", fill: false},
      ]},
      options: {animation: false, scales: {x: {ticks: {color: "#eee"}}, y: {min: 0, max: C.K, ticks: {color: "#eee"}}},
                plugins: {legend: {labels: {color: "#eee"}}}}
    });
  } else {
    stockChart.data.labels = labels;
    stockChart.data.datasets[0].data = stock;
    stockChart.data.datasets[1].data = halfK;
    stockChart.data.datasets[2].data = marks;
    stockChart.update();
  }
}

function updateCatchChart(rec) {
  const labels = rec.fishers.map(f => f.name);
  const catches = rec.fishers.map(f => f.catch);
  const reports = rec.fishers.map(f => f.report);
  const line = labels.map(() => C.PER_FISHER_SUSTAINABLE);
  if (!catchChart) {
    catchChart = new Chart($("catchchart"), {
      type: "bar",
      data: {labels, datasets: [
        {label: "catch", data: catches, backgroundColor: "#e67e22"},
        {label: "report", data: reports, backgroundColor: "#9b59b6"},
        {type: "line", label: "sustainable " + C.PER_FISHER_SUSTAINABLE, data: line, borderColor: "#2ecc71", borderDash: [6, 6], pointRadius: 0, fill: false},
      ]},
      options: {animation: false, scales: {x: {ticks: {color: "#eee"}}, y: {min: 0, max: C.C_MAX, ticks: {color: "#eee"}}},
                plugins: {legend: {labels: {color: "#eee"}}}}
    });
  } else {
    catchChart.data.labels = labels;
    catchChart.data.datasets[0].data = catches;
    catchChart.data.datasets[1].data = reports;
    catchChart.data.datasets[2].data = line;
    catchChart.update();
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function loadResults() {
  let data;
  try {
    data = await api("/api/batch");
  } catch (e) {
    $("resultstable").textContent = "no runs/batch/results.csv yet";
    return;
  }
  const numCols = ["rounds_survived", "final_stock", "total_catch", "gini", "share_over_quota", "share_lying"];
  const byRule = {};
  for (const row of data.rows) {
    if (!byRule[row.rule_name]) byRule[row.rule_name] = [];
    byRule[row.rule_name].push(row);
  }
  const avg = Object.entries(byRule).map(([rule, rows]) => {
    const o = {rule_name: rule, n: rows.length};
    for (const c of numCols) o[c] = rows.reduce((s, r) => s + (parseFloat(r[c]) || 0), 0) / rows.length;
    return o;
  }).sort((a, b) => b.rounds_survived - a.rounds_survived);
  let html = "<table><tr><th>rule</th><th>runs</th><th>rounds</th><th>final stock</th><th>catch</th><th>gini</th><th>over quota</th><th>lying</th></tr>";
  for (const o of avg) {
    html += "<tr><td>" + esc(o.rule_name) + "</td><td>" + o.n + "</td><td>" + o.rounds_survived.toFixed(1) +
      "</td><td>" + o.final_stock.toFixed(0) + "</td><td>" + o.total_catch.toFixed(0) +
      "</td><td>" + o.gini.toFixed(3) + "</td><td>" + (o.share_over_quota * 100).toFixed(0) +
      "%</td><td>" + (o.share_lying * 100).toFixed(0) + "%</td></tr>";
  }
  $("resultstable").innerHTML = html + "</table>";
}

async function loadInspector() {
  const runId = $("runpicker").value;
  if (!runId) return;
  let data;
  try {
    data = await api("/api/runs/" + encodeURIComponent(runId) + "/inspector");
  } catch (e) {
    $("inspectorbox").textContent = "inspector output not ready for " + runId + " yet";
    return;
  }
  const checks = data.checks || [];
  if (!checks.length) {
    $("inspectorbox").textContent = "inspector output not ready for " + runId + " yet";
    return;
  }
  const last = checks[checks.length - 1];
  const baseline = last.baseline != null ? Number(last.baseline) : 0.3;
  let sum = 0;
  const rows = checks.map((c, i) => {
    const score = Number(c.precision) || 0;
    sum += score;
    const lied = new Set(c.truly_lied || []);
    const accused = (c.accused || []).map(n => {
      const why = c.reasons && c.reasons[n] ? ' title="' + esc(c.reasons[n]) + '"' : "";
      return lied.has(n)
        ? '<span class="hit"' + why + ">" + esc(n) + " ✓</span>"
        : '<span' + why + ">" + esc(n) + "</span>";
    }).join(", ") || "—";
    return "<tr><td>" + c.round + "</td><td>" + accused + "</td><td>" +
      esc((c.truly_lied || []).join(", ") || "—") + "</td><td>" + score.toFixed(2) +
      "</td><td>" + (Number(c.recall) || 0).toFixed(2) + "</td><td>" + (sum / (i + 1)).toFixed(2) + "</td></tr>";
  });
  const mean = sum / checks.length;
  const verdict = mean >= baseline ? "above" : "below";
  $("inspectorbox").innerHTML =
    "<div style='margin-bottom:4px'>source: " + esc(data.source || "") +
    " · running mean score <b>" + mean.toFixed(3) + "</b> (" + verdict + " baseline " + baseline + ")</div>" +
    "<table><tr><th>round</th><th>accused</th><th>true top 3</th><th>prec</th><th>recall</th><th>mean so far</th></tr>" +
    rows.join("") + "</table>";
}

async function toggleMic() {
  const btn = $("mic");
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    toast("mic error: " + e.message);
    return;
  }
  micChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size) micChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("recording");
    $("micstatus").textContent = "transcribing…";
    const blob = new Blob(micChunks, {type: mediaRecorder.mimeType || "audio/webm"});
    const r = await fetch("/transcribe", {method: "POST", headers: {"Content-Type": "application/octet-stream"}, body: await blob.arrayBuffer()});
    if (!r.ok) { toast("transcribe failed: " + await r.text()); return; }
    const data = await r.json();
    $("ruletext").value = data.text;
    pendingRule = null;
    $("applyrule").disabled = true;
    $("micstatus").textContent = "transcript in rule box";
  };
  mediaRecorder.start();
  btn.classList.add("recording");
  $("micstatus").textContent = "recording… click again to stop";
}

async function speakLine(text) {
  if (!text) return;
  const r = await fetch("/speak", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  if (!r.ok) { toast("speak failed: " + await r.text()); return; }
  const url = URL.createObjectURL(await r.blob());
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  a.play();
}

function play() {
  if (timer || !rounds.length) return;
  if (cur >= rounds.length) { cur = 1; render(); }
  timer = setInterval(() => {
    cur++;
    if (cur > rounds.length) { pause(); return; }
    render();
  }, 700);
}

function pause() {
  if (timer) { clearInterval(timer); timer = null; }
}

function onPauseClick() {
  pause();
  if (liveRunId) {
    followLive = !followLive;
    $("pause").textContent = followLive ? "pause" : "resume live";
  }
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); hideHint(); timer ? pause() : play(); }
  if (e.key === "ArrowRight" && rounds.length) { e.preventDefault(); cur = Math.min(rounds.length, cur + 1); pause(); hideHint(); render(); }
  if (e.key === "ArrowLeft" && rounds.length) { e.preventDefault(); cur = Math.max(1, cur - 1); pause(); hideHint(); render(); }
});

init().catch(e => { toast("init error: " + e.message); });
</script>
</body>
</html>
