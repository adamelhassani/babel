<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commons</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
#topbar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #333;flex-wrap:wrap}
button,select,input{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px 8px}
.panels{display:grid;grid-template-columns:380px 1fr 1fr;gap:8px;padding:8px}
.panel{border:1px solid #333;border-radius:8px;padding:8px;min-height:360px}
h3{margin:4px 0}
#lakebox{position:relative;width:340px;height:340px;margin:0 auto}
#lake{position:absolute;left:40px;top:40px}
.boat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:96px}
.boat .bubble{background:#fff;color:#111;border-radius:8px;padding:2px 6px;font-size:10px;min-height:26px;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.boat .hull{font-size:18px;line-height:1}
.boat .name{font-size:10px;color:#ccc}
#roundlabel,#status{font-size:12px;color:#aaa;white-space:nowrap}
.rulebox{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 10px;font-size:12px;color:#f1c40f;border-bottom:1px solid #333}
.rulebox b{color:#eee;font-weight:600}
.boat .fstat{font-size:9px;color:#e74c3c;min-height:11px}
.boat.banned{opacity:.45}
.boat .play{font-size:10px;padding:0 5px;margin-top:1px}
button:disabled{opacity:.3}
#mic.recording{background:#7a1f1f;border-color:#e74c3c}
.panel table{border-collapse:collapse;font-size:11px}
.panel td,.panel th{padding:1px 6px;border-bottom:1px solid #222;text-align:right}
.panel th{color:#aaa}
.panel td:first-child,.panel th:first-child{text-align:left}
#micstatus{font-size:12px;color:#888}
canvas{max-height:340px}
</style>
</head>
<body>
<div id="topbar">
  <h3 style="margin:0">Commons</h3>
  <label>run <select id="runpicker"></select></label>
  <label>seed <input id="seed" type="number" value="0" style="width:60px"></label>
  <button id="startrun">start run</button>
  <button id="play">play</button>
  <button id="pause">pause</button>
  <input id="round" type="range" min="1" max="1" value="1" style="flex:1">
  <span id="roundlabel"></span>
  <span id="status"></span>
  <input id="ruletext" type="text" placeholder="type a rule: nobody may take more than 6 fish..." style="flex:1">
  <button id="applyrule">apply rule</button>
</div>
<div class="rulebox" id="rulebox"></div>
<div class="panels">
  <div class="panel"><h3>Lake</h3>
    <div id="lakebox">
      <svg id="lake" width="260" height="260"><circle id="lakecircle" cx="130" cy="130" r="100" fill="#3498db"/></svg>
      <div id="boats"></div>
    </div>
  </div>
  <div class="panel"><h3>Stock over rounds</h3><canvas id="stockchart"></canvas></div>
  <div class="panel"><h3>Catch vs report</h3><canvas id="catchchart"></canvas></div>
</div>
<div class="panels">
  <div class="panel"><h3>Results (avg by rule, sorted by rounds survived)</h3><div id="resultstable"></div></div>
  <div class="panel"><h3>Inspector</h3><div id="inspectorbox"></div></div>
  <div class="panel"><h3>Audio</h3>
    <button id="mic">● record rule</button>
    <span id="micstatus"></span>
    <p style="font-size:12px;color:#888">Record a rule aloud; the transcript lands in the rule box. ▶ on a boat bubble speaks its line.</p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let C = null, rounds = [], cur = 1, timer = null, stockChart = null, catchChart = null;
let liveRunId = null, mediaRecorder = null, micChunks = [], pollCount = 0;

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function init() {
  C = await api("/api/constants");
  const data = await api("/api/runs");
  const picker = $("runpicker");
  for (const name of data.runs) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    picker.appendChild(opt);
  }
  if (data.runs.includes("phase0-seed0")) picker.value = "phase0-seed0";
  else if (data.runs.length) picker.value = data.runs[0];
  picker.onchange = () => { liveRunId = null; loadRun(picker.value); };
  $("startrun").onclick = startRun;
  $("applyrule").onclick = applyRule;
  $("mic").onclick = toggleMic;
  $("play").onclick = play;
  $("pause").onclick = pause;
  $("round").oninput = e => { cur = +e.target.value; pause(); render(); };
  await loadRun(picker.value);
  await loadResults();
  setInterval(poll, 1000);
}

async function startRun() {
  const seed = +$("seed").value || 0;
  const r = await fetch("/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({seed})});
  if (!r.ok) { $("status").textContent = "start failed: " + await r.text(); return; }
  const data = await r.json();
  liveRunId = data.run_id;
  await refreshPicker();
  $("runpicker").value = liveRunId;
  try { await loadRun(liveRunId); } catch (e) { render(); }
}

async function applyRule() {
  const runId = $("runpicker").value;
  const text = $("ruletext").value.trim();
  if (!runId || !text) return;
  const r = await fetch("/rule", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({run_id: runId, text})});
  if (!r.ok) { $("status").textContent = "rule failed: " + await r.text(); return; }
  const data = await r.json();
  showRule(data.rule);
  $("status").textContent = "rule applied to " + runId;
  if (runId === liveRunId) poll();
}

function showRule(rule) {
  const box = $("rulebox");
  box.innerHTML = "";
  for (const [k, v] of Object.entries(rule)) {
    const s = document.createElement("span");
    const b = document.createElement("b");
    b.textContent = k + ": ";
    s.appendChild(b);
    s.appendChild(document.createTextNode(String(v)));
    box.appendChild(s);
  }
}

async function refreshPicker() {
  const data = await api("/api/runs");
  const picker = $("runpicker");
  for (const name of data.runs) {
    if (![...picker.options].some(o => o.value === name)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      picker.appendChild(opt);
    }
  }
}

async function poll() {
  pollCount++;
  if (liveRunId) {
    let data;
    try {
      data = await api("/state/" + encodeURIComponent(liveRunId));
    } catch (e) {
      data = null;
    }
    if (data) {
      rounds = data.rounds;
      const slider = $("round");
      slider.max = Math.max(1, rounds.length);
      if (rounds.length) cur = rounds.length;
      render();
      await refreshPicker();
      if (!data.active) liveRunId = null;
    }
  }
  await loadInspector();
  if (pollCount % 5 === 0) await loadResults();
}

async function loadRun(id) {
  const data = await api("/api/runs/" + encodeURIComponent(id) + "/rounds");
  rounds = data.rounds;
  const slider = $("round");
  slider.min = 1;
  slider.max = Math.max(1, rounds.length);
  cur = rounds.length;
  slider.value = cur;
  buildBoats();
  render();
}

function buildBoats() {
  const box = $("boats");
  box.innerHTML = "";
  const n = rounds.length ? rounds[rounds.length - 1].fishers.length : C.N;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "boat";
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    d.style.left = (170 + 150 * Math.cos(ang)) + "px";
    d.style.top = (170 + 150 * Math.sin(ang)) + "px";
    d.innerHTML = '<div class="bubble"></div><div class="hull">🛶</div><div class="name"></div><div class="fstat"></div><button class="play" title="speak line">▶</button>';
    box.appendChild(d);
  }
}

function render() {
  if (!rounds.length) return;
  const rec = rounds[cur - 1];
  if ($("boats").children.length !== rec.fishers.length) buildBoats();
  $("round").value = cur;
  const dead = rec.stock_after < C.F_DEAD;
  $("roundlabel").textContent = "round " + rec.round + " / " + rounds.length;
  $("status").textContent = (dead ? "lake dead" : "stock " + rec.stock_after) + " | " + (rec.rule ? rec.rule.plain_text : "no rule in effect");
  const circle = $("lakecircle");
  const frac = Math.max(0, Math.min(1, rec.stock_after / C.K));
  circle.setAttribute("r", (20 + 110 * Math.sqrt(frac)).toFixed(1));
  circle.setAttribute("fill", dead ? "#666" : "#3498db");
  const boats = $("boats").children;
  rec.fishers.forEach((f, i) => {
    if (!boats[i]) return;
    boats[i].querySelector(".bubble").textContent = f.say || "";
    boats[i].querySelector(".name").textContent = f.name;
    boats[i].querySelector(".fstat").textContent = f.banned ? "banned" : (f.fined > 0 ? "fined " + f.fined : "");
    boats[i].classList.toggle("banned", !!f.banned);
    const pb = boats[i].querySelector(".play");
    pb.disabled = !f.say;
    pb.onclick = () => speakLine(f.say);
  });
  updateStockChart();
  updateCatchChart(rec);
}

function ruleMarkerRounds() {
  const markers = new Set();
  for (let i = 0; i < rounds.length; i++) {
    const r = rounds[i].rule;
    const prev = i > 0 ? rounds[i - 1].rule : null;
    if (r && (!prev || JSON.stringify(prev) !== JSON.stringify(r))) markers.add(rounds[i].round);
  }
  return markers;
}

function updateStockChart() {
  const seen = rounds.slice(0, cur);
  const labels = seen.map(r => r.round);
  const stock = seen.map(r => r.stock_after);
  const halfK = labels.map(() => C.K / 2);
  const markers = ruleMarkerRounds();
  const marks = labels.map(l => markers.has(l) ? C.K * 0.97 : null);
  if (!stockChart) {
    stockChart = new Chart($("stockchart"), {
      type: "line",
      data: {labels, datasets: [
        {label: "stock", data: stock, borderColor: "#3498db", pointRadius: 2, tension: 0.2},
        {label: "K/2 = " + C.K / 2, data: halfK, borderColor: "#888", borderDash: [6, 6], pointRadius: 0, fill: false},
        {label: "rule applied", data: marks, showLine: false, pointRadius: 6, pointBackgroundColor: "#f1c40f", fill: false},
      ]},
      options: {animation: false, scales: {x: {ticks: {color: "#eee"}}, y: {min: 0, max: C.K, ticks: {color: "#eee"}}},
                plugins: {legend: {labels: {color: "#eee"}}}}
    });
  } else {
    stockChart.data.labels = labels;
    stockChart.data.datasets[0].data = stock;
    stockChart.data.datasets[1].data = halfK;
    stockChart.data.datasets[2].data = marks;
    stockChart.update();
  }
}

function updateCatchChart(rec) {
  const labels = rec.fishers.map(f => f.name);
  const catches = rec.fishers.map(f => f.catch);
  const reports = rec.fishers.map(f => f.report);
  const line = labels.map(() => C.PER_FISHER_SUSTAINABLE);
  if (!catchChart) {
    catchChart = new Chart($("catchchart"), {
      type: "bar",
      data: {labels, datasets: [
        {label: "catch", data: catches, backgroundColor: "#e67e22"},
        {label: "report", data: reports, backgroundColor: "#9b59b6"},
        {type: "line", label: "sustainable " + C.PER_FISHER_SUSTAINABLE, data: line, borderColor: "#2ecc71", borderDash: [6, 6], pointRadius: 0, fill: false},
      ]},
      options: {animation: false, scales: {x: {ticks: {color: "#eee"}}, y: {min: 0, max: C.C_MAX, ticks: {color: "#eee"}}},
                plugins: {legend: {labels: {color: "#eee"}}}}
    });
  } else {
    catchChart.data.labels = labels;
    catchChart.data.datasets[0].data = catches;
    catchChart.data.datasets[1].data = reports;
    catchChart.data.datasets[2].data = line;
    catchChart.update();
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function loadResults() {
  let data;
  try {
    data = await api("/api/batch");
  } catch (e) {
    $("resultstable").textContent = "no runs/batch/results.csv yet";
    return;
  }
  const numCols = ["rounds_survived", "final_stock", "total_catch", "gini", "share_over_quota", "share_lying"];
  const byRule = {};
  for (const row of data.rows) {
    if (!byRule[row.rule_name]) byRule[row.rule_name] = [];
    byRule[row.rule_name].push(row);
  }
  const avg = Object.entries(byRule).map(([rule, rows]) => {
    const o = {rule_name: rule, n: rows.length};
    for (const c of numCols) o[c] = rows.reduce((s, r) => s + (parseFloat(r[c]) || 0), 0) / rows.length;
    return o;
  }).sort((a, b) => b.rounds_survived - a.rounds_survived);
  let html = "<table><tr><th>rule</th><th>runs</th><th>rounds</th><th>final stock</th><th>catch</th><th>gini</th><th>over quota</th><th>lying</th></tr>";
  for (const o of avg) {
    html += "<tr><td>" + esc(o.rule_name) + "</td><td>" + o.n + "</td><td>" + o.rounds_survived.toFixed(1) +
      "</td><td>" + o.final_stock.toFixed(0) + "</td><td>" + o.total_catch.toFixed(0) +
      "</td><td>" + o.gini.toFixed(3) + "</td><td>" + (o.share_over_quota * 100).toFixed(0) +
      "%</td><td>" + (o.share_lying * 100).toFixed(0) + "%</td></tr>";
  }
  $("resultstable").innerHTML = html + "</table>";
}

async function loadInspector() {
  const runId = $("runpicker").value;
  if (!runId) return;
  let data;
  try {
    data = await api("/api/runs/" + encodeURIComponent(runId) + "/inspector");
  } catch (e) {
    $("inspectorbox").textContent = "inspector output not ready for " + runId + " yet";
    return;
  }
  const checks = data.checks || [];
  if (!checks.length) {
    $("inspectorbox").textContent = "inspector output not ready for " + runId + " yet";
    return;
  }
  let html = "<table><tr><th>round</th><th>accused</th><th>truly lied</th><th>precision</th><th>recall</th></tr>";
  for (const c of checks) {
    html += "<tr><td>" + c.round + "</td><td>" + esc((c.accused || []).join(", ") || "—") +
      "</td><td>" + esc((c.truly_lied || []).join(", ") || "—") + "</td><td>" +
      Number(c.precision).toFixed(2) + "</td><td>" + Number(c.recall).toFixed(2) + "</td></tr>";
  }
  $("inspectorbox").innerHTML = html + "</table>";
}

async function toggleMic() {
  const btn = $("mic");
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    $("micstatus").textContent = "mic error: " + e.message;
    return;
  }
  micChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size) micChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("recording");
    $("micstatus").textContent = "transcribing…";
    const blob = new Blob(micChunks, {type: mediaRecorder.mimeType || "audio/webm"});
    const r = await fetch("/transcribe", {method: "POST", headers: {"Content-Type": "application/octet-stream"}, body: await blob.arrayBuffer()});
    if (!r.ok) { $("micstatus").textContent = "transcribe failed: " + await r.text(); return; }
    const data = await r.json();
    $("ruletext").value = data.text;
    $("micstatus").textContent = "transcript in rule box";
  };
  mediaRecorder.start();
  btn.classList.add("recording");
  $("micstatus").textContent = "recording… click again to stop";
}

async function speakLine(text) {
  if (!text) return;
  const r = await fetch("/speak", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  if (!r.ok) return;
  const url = URL.createObjectURL(await r.blob());
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  a.play();
}

function play() {
  if (timer || !rounds.length) return;
  if (cur >= rounds.length) { cur = 1; render(); }
  timer = setInterval(() => {
    cur++;
    if (cur > rounds.length) { pause(); return; }
    render();
  }, 700);
}

function pause() {
  if (timer) { clearInterval(timer); timer = null; }
}

init().catch(e => { $("status").textContent = "error: " + e.message; });
</script>
</body>
</html>
